name: Lint

on:
  pull_request:
    branches: main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build test container
        run: docker build --target test -t kouden-summary-lint .

      - name: Run ruff lint check
        run: docker run --rm kouden-summary-lint
